<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Captured network calls</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="bar">
    <h1>Captured network calls</h1>
    <a class="button" href="index.html" target="_blank">Open demo page</a>
  </header>

  <main class="wide">
    <div class="toolbar">
      <label class="grow">Page view
        <select id="pageview"></select>
      </label>
      <label><input type="checkbox" id="auto" checked> Auto-refresh</label>
      <button id="refresh">Refresh</button>
      <button id="clear" class="danger">Clear database</button>
    </div>

    <div id="summary" class="summary"></div>

    <section>
      <h2>Hosts contacted</h2>
      <table id="hosts">
        <thead><tr><th>Host</th><th>Party</th><th class="num">Calls</th><th class="num">Failed</th><th class="num">Transferred</th><th>Types</th></tr></thead>
        <tbody></tbody>
      </table>
    </section>

    <section>
      <h2>Calls</h2>
      <div class="toolbar">
        <input type="search" id="search" class="grow" placeholder="Filter by URL or initiator…">
        <select id="type"><option value="">All types</option></select>
        <label><input type="checkbox" id="third-party"> Third-party only</label>
        <label><input type="checkbox" id="failed"> Failed only</label>
      </div>
      <table id="calls">
        <thead><tr><th class="num">Start</th><th>Type</th><th>Method</th><th>Status</th><th>URL</th><th class="num">Time</th><th class="num">Size</th><th>Initiator</th></tr></thead>
        <tbody></tbody>
      </table>
      <p id="empty" class="muted" hidden>Nothing captured yet. Open the demo page and come back.</p>
    </section>
  </main>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"
          integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
  <script src="js/viewer.js"></script>
</body>
</html>
